# Review current Render plan prices before applying. This file does not create
# resources until the repository owner explicitly creates a Blueprint.
services:
  - type: web
    name: palcare
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm db:migrate && pnpm db:seed
    startCommand: pnpm start --port $PORT
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: DEMO_DATA_SOURCE
        value: database
      - key: PAYPAL_CHECKOUT_ENABLED
        value: "false"
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: DATABASE_URL
        fromDatabase:
          name: palcare-postgres
          property: connectionString
databases:
  - name: palcare-postgres
    region: oregon
    postgresMajorVersion: "17"
    plan: 0.1c-256mb
    diskSizeGB: 1
    databaseName: palcare
    ipAllowList: []
