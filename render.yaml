# Review current Render plan prices before applying. This file does not create
# resources until the repository owner explicitly creates a Blueprint.
services:
  - type: web
    name: palcare-judge
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: (git remote get-url origin >/dev/null 2>&1 || git remote add origin https://github.com/fmruslan/Pal-Care-Ruslan.git) && corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Migrations/seeding run in a separately authorized operator environment.
    # Never provide owner/migration credentials to this web service.
    startCommand: pnpm start --port $PORT
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: PALCARE_HOSTED_DEMO
        value: "true"
      - key: DEMO_DATA_SOURCE
        value: database
      - key: PAYPAL_CHECKOUT_ENABLED
        value: "false"
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: GUARDIAN_OPERATIONS_ENABLED
        value: "false"
      - key: GUARDIAN_REFUNDS_ENABLED
        value: "false"
      - key: GUARDIAN_PROVIDER_READS_ENABLED
        value: "false"
      - key: CAREOS_PROVIDER
        value: responses
      - key: CAREOS_MODEL
        value: deepseek-flash
      - key: CAREOS_RESPONSES_BASE_URL
        value: https://api.deepseek.com
      - key: CAREOS_LIVE_ENABLED
        value: "true"
      - key: CAREOS_PROVIDER_LIMIT_CONFIRMED
        value: "true"
      - key: CAREOS_API_KEY
        sync: false
      - key: CAREOS_OWNER_MODE
        value: "false"
      - key: CAREOS_STANDING_AI_ENABLED
        value: "false"
      - key: CAREOS_SUBSCRIPTION_ENABLED
        value: "false"
      - key: CAREOS_OWNER_PAIRING_ENABLED
        value: "false"
      - key: CAREOS_EVALUATION_ENABLED
        value: "true"
      - key: CAREOS_EVALUATION_EXPIRES_AT
        value: "2027-01-01T08:00:00Z"
      # Automatic guest cookies replace manual scope hashes in hosted mode.
      # Existing ledger/ID/unknowns are retained; $2 of $20 remains outside cap.
      - key: CAREOS_DAILY_BUDGET_MICRO
        value: "18000000"
      - key: CAREOS_TOTAL_BUDGET_MICRO
        value: "18000000"
      - key: CAREOS_BUDGET_ID
        value: render-judge
      - key: CARE_DEMO_ENABLED
        value: "true"
      - key: CARE_CONSUMER_SCENARIOS_ENABLED
        value: "true"
      - key: CARE_DEMO_READER_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false # Explicit restricted reader login, NOT the default owner URL.
      - key: CAREOS_DATABASE_URL
        sync: false # Explicit conversation-only writer login.
      - key: APP_ORIGIN
        sync: false # Exact deployed HTTPS origin; no trailing slash.
databases:
  - name: palcare-judge-postgres
    region: oregon
    postgresMajorVersion: "17"
    plan: 0.1c-256mb
    diskSizeGB: 1
    databaseName: palcare
    ipAllowList: []
