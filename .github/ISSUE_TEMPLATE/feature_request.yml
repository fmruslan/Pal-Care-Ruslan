name: Feature or improvement
description: Describe one focused improvement and its acceptance criteria
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Which purchase-care problem does this solve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable behavior or test proves completion?
    validations:
      required: true
