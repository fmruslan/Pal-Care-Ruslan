name: Repository checks

on:
  push:
    branches: [main]
    tags: ["submission-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

# All mandatory runners use independent disposable PostgreSQL services and the
# same provider-off policy; none can read application/owner credentials.
env:
  DATABASE_URL: postgresql://palcare:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/palcare_test
  TEST_DATABASE_URL: postgresql://palcare:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/palcare_test
  DEMO_DATA_SOURCE: database
  PAYPAL_CHECKOUT_ENABLED: "false"
  CAREOS_PROVIDER: "fixture"
  CAREOS_LIVE_ENABLED: "false"
  GUARDIAN_REFUNDS_ENABLED: "false"
  GUARDIAN_PROVIDER_READS_ENABLED: "false"
  PRICE_GUARDIAN_CHECKOUT_ENABLED: "false"
  DISCOVERY_PROVIDER: "fixture"
  CHANNEL3_LIVE_ENABLED: "false"
  CHANNEL3_FREE_CREDITS_CONFIRMED: "false"
  CPSC_REFRESH_ENABLED: "false"

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.risk.outputs.lane }}
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: risk
        # Classify with the base revision's policy, not a modified classifier in
        # this PR. First installation/unavailable history always bootstraps full.
        run: |
          if [[ "$CI_BASE" =~ ^[a-f0-9]{40}$ ]] && git cat-file -e "$CI_BASE:scripts/ci-risk.mjs" 2>/dev/null; then
            git show "$CI_BASE:scripts/ci-risk.mjs" > .ci-trusted-risk.mjs
            node .ci-trusted-risk.mjs
            rm .ci-trusted-risk.mjs
          else
            node --input-type=module -e 'import {writeFileSync,appendFileSync} from "node:fs";const result={lane:"full",base:process.env.CI_BASE||null,head:process.env.CI_HEAD,forceFull:true,reasons:[{path:"trusted-policy-unavailable",lane:"full"}]};writeFileSync("ci-risk.json",JSON.stringify(result,null,2));appendFileSync(process.env.GITHUB_OUTPUT,"lane=full\n");console.log(JSON.stringify(result));'
          fi
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_EVENT: ${{ github.event_name }}
      - id: reuse
        name: Reuse only successful PR evidence for an identical merged tree
        run: node scripts/verify-ci-release.mjs --select-reuse
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: risk-classification
          path: ci-risk.json
          retention-days: 30

  fast-ui:
    needs: classify
    if: needs.classify.outputs.lane == 'fast' && needs.classify.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEMO_DATA_SOURCE: fixtures
      DATABASE_URL: ""
      TEST_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-repository.mjs
      - run: pnpm format:check
      - run: pnpm check
      - name: Verify narrow Ubuntu mirror transform
        run: node --test scripts/ci-ubuntu-mirrors.test.mjs
      - name: Select existing official Ubuntu HTTPS fallbacks (ephemeral CI only)
        timeout-minutes: 1
        run: sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_ENVIRONMENT "$(command -v node)" scripts/ci-ubuntu-mirrors.mjs
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Focused Care, provenance, Studio, responsive and accessibility checks
        run: pnpm exec playwright test --config=playwright.demo-care.config.ts --project=desktop-light --project=mobile-dark
        env:
          E2E_PORT: "3110"
      - name: Focused visual and appearance regressions
        run: pnpm test:ui
        env:
          E2E_PORT: "3110"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fast-ui-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  feature-acceptance:
    needs: classify
    if: needs.classify.outputs.lane == 'feature' && needs.classify.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: palcare
          POSTGRES_DB: palcare_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U palcare -d palcare_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-repository.mjs
      - run: pnpm format:check
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - name: Verify narrow Ubuntu mirror transform
        run: node --test scripts/ci-ubuntu-mirrors.test.mjs
      - name: Select existing official Ubuntu HTTPS fallbacks (ephemeral CI only)
        timeout-minutes: 1
        run: sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_ENVIRONMENT "$(command -v node)" scripts/ci-ubuntu-mirrors.mjs
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Care, Studio and provenance acceptance
        run: pnpm exec playwright test --config=playwright.demo-care.config.ts
        env:
          E2E_PORT: "3110"
      - name: Customer Care, North and native Insights regressions
        run: pnpm exec playwright test tests/e2e/care-homepage.spec.ts tests/e2e/customer-insights.spec.ts tests/e2e/integrated-north.spec.ts tests/e2e/home-library.spec.ts tests/e2e/careos-care.spec.ts tests/e2e/design.spec.ts --project=desktop-light --project=mobile-dark
        env:
          E2E_PORT: "3110"
      - name: Saved database to native calendar and North History
        run: pnpm exec node scripts/workspace.mjs run test:integration tsx --test tests/integration/care-ten-products.test.ts
        env:
          PALCARE_DEMO_BROWSER_JOURNEY: "true"
      - name: Injected Sol protocol and actual Studio tools
        run: pnpm exec playwright test --config=playwright.sol.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: feature-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  foundation:
    needs: classify
    if: needs.classify.outputs.lane == 'full' && needs.classify.outputs.reuse != 'true'
    name: foundation (${{ matrix.data-source }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      # Complete both full data-source suites even if the other runner fails.
      fail-fast: false
      matrix:
        data-source: [fixtures, database]
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: palcare
          POSTGRES_DB: palcare_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U palcare -d palcare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Workspace and source provenance
        run: pnpm workspace:check
      - name: Verify repository baseline
        if: matrix.data-source == 'fixtures' && matrix.shard == 1
        run: node scripts/verify-repository.mjs
      - run: pnpm lint
        if: matrix.data-source == 'fixtures' && matrix.shard == 1
      - run: pnpm format:check
        if: matrix.data-source == 'fixtures' && matrix.shard == 1
      - run: pnpm typecheck
        if: matrix.data-source == 'fixtures' && matrix.shard == 1
      - run: pnpm test
        if: matrix.data-source == 'fixtures' && matrix.shard == 1
      - name: Versioned CareOS deterministic and fixture evaluations (no model calls)
        if: matrix.data-source == 'fixtures' && matrix.shard == 1
        run: pnpm careos:evaluate
      - name: Offline CareOS prompt and answer review fixtures (network disabled, no inference)
        if: matrix.data-source == 'fixtures' && matrix.shard == 1
        run: pnpm careos:review
      - name: PostgreSQL migrations, seeds and integrity tests
        if: matrix.data-source == 'database'
        run: pnpm test:integration
      - run: pnpm build
      - name: Unavailable database readiness (real production server)
        if: matrix.data-source == 'database' && matrix.shard == 1
        run: pnpm test:failure
      - name: Verify narrow Ubuntu mirror transform
        run: node --test scripts/ci-ubuntu-mirrors.test.mjs
      - name: Select existing official Ubuntu HTTPS fallbacks (ephemeral CI only)
        timeout-minutes: 1
        run: sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_ENVIRONMENT "$(command -v node)" scripts/ci-ubuntu-mirrors.mjs
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Full ${{ matrix.data-source }} browser and accessibility tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2
        env:
          E2E_DATA_SOURCE: ${{ matrix.data-source }}
      - name: Exclusive Guardian flow (test DB and injected provider only)
        if: matrix.data-source == 'database' && matrix.shard == 1
        run: pnpm test:guardian:e2e
      - name: Browser artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ matrix.data-source }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # An independent mandatory runner prevents the complete fixture/database
  # matrices from consuming this suite's job window. Keep all existing test
  # deadlines/retries and the 35-minute job bound; no coverage is filtered out.
  native-acceptance:
    needs: classify
    if: needs.classify.outputs.lane == 'full' && needs.classify.outputs.reuse != 'true'
    name: native-acceptance (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [journeys, compatibility]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: palcare
          POSTGRES_DB: palcare_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U palcare -d palcare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Workspace and source provenance
        run: pnpm workspace:check
      - name: PostgreSQL migrations, seeds and integrity tests
        if: matrix.suite == 'journeys'
        run: pnpm test:integration
      - run: pnpm build
      - name: Verify narrow Ubuntu mirror transform
        run: node --test scripts/ci-ubuntu-mirrors.test.mjs
      - name: Select existing official Ubuntu HTTPS fallbacks (ephemeral CI only)
        timeout-minutes: 1
        run: sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_ENVIRONMENT "$(command -v node)" scripts/ci-ubuntu-mirrors.mjs
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-all-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        timeout-minutes: 10
      - name: Complete price-protection purchase-to-North journey (isolated DB and injected North only)
        if: matrix.suite == 'journeys'
        run: pnpm exec node scripts/workspace.mjs run test:integration tsx --test --test-concurrency=1 --test-name-pattern='purchase → policy discovery' tests/integration/price-protection.test.ts
        env:
          PALCARE_PROTECTION_BROWSER_JOURNEY: "true"
      - name: Ten-product Care and retail-reference accessibility journeys (fictional fixtures, no provider calls)
        if: matrix.suite == 'journeys'
        run: pnpm exec playwright test --config=playwright.demo-care.config.ts
        env:
          E2E_PORT: "3110"
      - name: Ten-product saved database to DOM and North continuity (isolated database and injected transport)
        if: matrix.suite == 'journeys'
        run: pnpm exec node scripts/workspace.mjs run test:integration tsx --test tests/integration/care-ten-products.test.ts
        env:
          PALCARE_DEMO_BROWSER_JOURNEY: "true"
      - name: Private owner pairing, browser persistence and expiry (isolated fixture, no inference)
        if: matrix.suite == 'journeys'
        run: pnpm exec playwright test --config=playwright.access.config.ts
      - name: Firefox and WebKit essential journeys (emulation, not real-device certification)
        if: matrix.suite == 'compatibility'
        run: pnpm test:compat
        env:
          E2E_PORT: "3108"
      - name: Sol protocol and Studio actual tools (injected HTTP only; no paid calls)
        if: matrix.suite == 'journeys'
        run: pnpm exec playwright test --config=playwright.sol.config.ts
      - name: Browser artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-browser-results-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  exact-release:
    needs: classify
    if: needs.classify.outputs.reuse == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEMO_DATA_SOURCE: fixtures
      DATABASE_URL: ""
      TEST_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: risk-classification
      - name: Revalidate original PR checks and exact merged source
        run: node scripts/verify-ci-release.mjs --check-reuse
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify narrow Ubuntu mirror transform
        run: node --test scripts/ci-ubuntu-mirrors.test.mjs
      - name: Select existing official Ubuntu HTTPS fallbacks (ephemeral CI only)
        timeout-minutes: 1
        run: sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_ENVIRONMENT "$(command -v node)" scripts/ci-ubuntu-mirrors.mjs
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 10
      - run: pnpm exec playwright test tests/e2e/release-smoke.spec.ts --project=desktop-light --project=mobile-dark
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: exact-release-smoke
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release-gate:
    if: always()
    needs:
      [classify, fast-ui, feature-acceptance, foundation, native-acceptance, exact-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Require the successful risk-selected checks, never a skipped required job
        run: node scripts/ci-gate.mjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
