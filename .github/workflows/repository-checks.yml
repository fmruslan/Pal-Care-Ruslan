name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify repository baseline
        run: node scripts/verify-repository.mjs

# Once the Next.js app exists, add lint, typecheck, unit and build checks.
# This workflow intentionally does not claim an unbuilt app was tested.
