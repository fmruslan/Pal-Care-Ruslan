services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: palcare
      POSTGRES_DB: palcare
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - palcare-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palcare -d palcare"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  palcare-postgres:
